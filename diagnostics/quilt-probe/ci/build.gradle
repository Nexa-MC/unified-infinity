plugins {
    id 'org.quiltmc.loom' version '1.8.5'
}

// The official plugin performs the complete vanilla merge/remap pipeline.
// The original probe is compiled separately by its unchanged, pinned builder.
layout.buildDirectory = file('../diagnostic-output/loom-build')
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        name = 'VerifiedPublicInputs'
        url = file('maven').toURI()
        metadataSources { gradleMetadata(); mavenPom(); artifact() }
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
}

loom {
    // Supported Loom API, pointing to the exact official version metadata.
    // Python seeds its original verified bytes; Gradle runs strictly offline.
    customMinecraftMetadata = 'https://piston-meta.mojang.com/v1/packages/22a1966494dfa4eeb5ee778c8e6ed5b774839582/1.21.1.json'
}

tasks.register('prepareProbeMappings') {
    description = 'Generate the official merged Minecraft/mapping inputs for the original probe builder.'
    dependsOn 'classes'
    doLast {
        // Loom 1.8.5 creates intermediary and named outputs eagerly during its
        // after-evaluation hook, even when compileJava is NO-SOURCE. Resolve the
        // official compile configuration explicitly and report provider outputs.
        def compileFiles = configurations.getByName('minecraftNamedCompile').resolve()
        def extension = net.fabricmc.loom.LoomGradleExtension.get(project)
        def root = file('..').toPath().toAbsolutePath().normalize()
        def describe = { path ->
            def normalized = path.toAbsolutePath().normalize()
            def target = normalized.toFile()
            [path: root.relativize(normalized).toString(), exists: target.isFile(),
             bytes: target.isFile() ? target.length() : null]
        }
        def outputs = [
            minecraftNamedCompileFiles: compileFiles.size(),
            intermediary: extension.getIntermediaryMinecraftProvider().getMinecraftJarPaths().collect(describe),
            named: extension.getNamedMinecraftProvider().getMinecraftJarPaths().collect(describe),
            mappings: describe(extension.getMappingConfiguration().tinyMappings)
        ]
        def out = file('../diagnostic-output/loom-provider-outputs.json')
        out.parentFile.mkdirs()
        out.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(outputs)) + '\n'
        println 'OFFICIAL_LOOM_PROVIDER_OUTPUTS ' + groovy.json.JsonOutput.toJson(outputs)
        println 'Official Quilt Loom output resolution completed; Minecraft was not launched.'
    }
}

gradle.taskGraph.whenReady { graph ->
    def forbidden = graph.allTasks.findAll {
        it.name.toLowerCase().contains('asset') ||
        it.name.toLowerCase().startsWith('run') ||
        it.name.toLowerCase().contains('launch') ||
        it.name.toLowerCase().contains('gensource') ||
        it instanceof JavaExec || it instanceof Test
    }
    if (!forbidden.empty) throw new GradleException("Out-of-scope diagnostic task graph: ${forbidden*.path}")
}
