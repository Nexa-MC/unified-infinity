# Metadata-only legacy capability view. The installed product initializes through FML PRODUCT_GAME.
# The unified_internal provider does not scan @Mod constructors or create an ordinary mod event bus.
modLoader="unified_internal"
loaderVersion="[1]"
license="All Rights Reserved (host); Apache-2.0 (bundled Forgified Fabric API)"

[[mods]]
modId="mod_compat_runtime"
version="${bundleVersion}"
displayName="Unified ∞ Infinity"
description='''
Installed Unified Infinity product and API bundle, initialized explicitly by the
source-owned FML product lifecycle. This metadata-only legacy capability view
preserves dependency and resource discovery; it is not an ordinary mod entrypoint.
Embeds the official unchanged Forgified Fabric API aggregate and managed Quilt
modules. Original upstream implementation, authorship and licenses remain credited.
'''

[[dependencies.mod_compat_runtime]]
modId="neoforge"
type="required"
versionRange="[${neoForgeVersion}]"
ordering="NONE"
side="BOTH"

[[dependencies.mod_compat_runtime]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
ordering="NONE"
side="BOTH"

[[dependencies.mod_compat_runtime]]
modId="connector"
type="required"
versionRange="[${connectorVersion}]"
ordering="AFTER"
side="BOTH"

[[dependencies.mod_compat_runtime]]
modId="fabric_api"
type="required"
versionRange="[${ffapiVersion}]"
ordering="AFTER"
side="BOTH"

[[dependencies.mod_compat_runtime]]
modId="forgified_fabric_api"
type="required"
versionRange="[${ffapiVersion}]"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="unified-infinity.client-branding.mixins.json"

${qslDependencies}
