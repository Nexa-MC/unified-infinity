side="BOTH"

[[dependencies.mod_compat_runtime]]
modId="connector"
type="required"
versionRange="[${connectorVersion}]"
ordering="AFTER"
side="BOTH"

[[dependencies.mod_compat_runtime]]
modId="fabric_api"
type="required"
versionRange="[${ffapiVersion}]"
ordering="AFTER"
side="BOTH"

[[dependencies.mod_compat_runtime]]
modId="forgified_fabric_api"
type="required"
versionRange="[${ffapiVersion}]"
ordering="AFTER"
side="BOTH"
