[[mods]]
modId="mod_compat_runtime"
version="${bundleVersion}"
displayName="Unified ∞ Infinity"
description='''
Native NeoForge packaging host that embeds the official, unchanged Forgified
Fabric API aggregate. Uses the original Sinytra Connector companion for Fabric
mod transformation and loading. Not a reimplementation of those projects.
'''

[[dependencies.mod_compat_runtime]]
modId="neoforge"
type="required"
versionRange="[${neoForgeVersion}]"
