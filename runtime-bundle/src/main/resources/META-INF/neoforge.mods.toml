[[mods]]
modId="mod_compat_runtime"
version="${bundleVersion}"
displayName="Unified ∞ Infinity"
description='''
Native NeoForge packaging host that embeds the official, unchanged Forgified
Fabric API aggregate. Uses the exact managed Sinytra Connector-based core profile
for Fabric transformation and loading, including disclosed source-built variants.
Original upstream implementation, authorship and licenses remain credited.
'''

[[dependencies.mod_compat_runtime]]
modId="neoforge"
type="required"
versionRange="[${neoForgeVersion}]"
ordering="NONE"
side="BOTH"

[[dependencies.mod_compat_runtime]]
modId="minecraft"
type="required"
versionRange="[1.21.1]"
ordering="NONE"
side="BOTH"

[[dependencies.mod_compat_runtime]]
modId="connector"
type="required"
versionRange="[${connectorVersion}]"
ordering="AFTER"
side="BOTH"

[[dependencies.mod_compat_runtime]]
modId="fabric_api"
type="required"
versionRange="[${ffapiVersion}]"
ordering="AFTER"
side="BOTH"

[[dependencies.mod_compat_runtime]]
modId="forgified_fabric_api"
type="required"
versionRange="[${ffapiVersion}]"
ordering="AFTER"
side="BOTH"

[[mixins]]
config="unified-infinity.client-branding.mixins.json"

${qslDependencies}
