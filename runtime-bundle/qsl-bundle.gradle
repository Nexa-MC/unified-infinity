// Optional, digest-pinned QSL payload deployment. Runtime compatibility is a
// separate test; this never embeds a second Quilt Loader implementation.
import groovy.json.JsonSlurper
import groovy.json.JsonOutput
import java.security.MessageDigest
import java.util.zip.ZipFile

ext.qslEntries = []
if (providers.gradleProperty('qslInventory').isPresent()) {
    File inventoryFile = file(providers.gradleProperty('qslInventory').get())
    def inventory = new JsonSlurper().parse(inventoryFile)
    if (inventory.schemaVersion != 1 || !(inventory.modules instanceof List) || inventory.modules.isEmpty()) {
        throw new GradleException('Invalid QSL inventory schema or empty selection')
    }
    Set<String> ids = new HashSet<>()
    Set<String> coordinates = new HashSet<>()
    inventory.modules.each { entry ->
        if (!(entry.id ==~ /[a-z][a-z0-9_]{1,63}/) || !ids.add(entry.id)) throw new GradleException('Invalid or duplicate QSL logical ID')
        if (!(entry.group ==~ /org\.quiltmc\.qsl\.[a-z0-9_.]+/) || !(entry.artifact ==~ /[a-z0-9_\-]+/) || !coordinates.add(entry.group + ':' + entry.artifact)) throw new GradleException('Invalid or duplicate QSL coordinate')
        if (!(entry.version ==~ /[A-Za-z0-9_.+\-]+/) || !(entry.sha256 ==~ /[0-9a-f]{64}/)) throw new GradleException('QSL version and SHA-256 must be pinned')
        File payload = new File(inventoryFile.parentFile, entry.file).canonicalFile
        if (!payload.isFile() || payload.length() > 16 * 1024 * 1024) throw new GradleException('Missing or oversized QSL payload')
        def md = MessageDigest.getInstance('SHA-256')
        payload.withInputStream { input -> byte[] buffer = new byte[65536]; for (int count = input.read(buffer); count != -1; count = input.read(buffer)) md.update(buffer, 0, count) }
        if (md.digest().encodeHex().toString() != entry.sha256) throw new GradleException('QSL SHA-256 mismatch: ' + entry.id)
        new ZipFile(payload).withCloseable { archive ->
            def descriptor = archive.getEntry('quilt.mod.json')
            if (descriptor == null || descriptor.size > 1048576 || descriptor.size < 0) throw new GradleException('Missing or oversized native Quilt metadata')
            def metadata = new JsonSlurper().parse(archive.getInputStream(descriptor))
            if (metadata.schema_version != 1 || metadata.quilt_loader.id != entry.id || metadata.quilt_loader.version != entry.version) throw new GradleException('QSL payload identity differs from pin')
            if (metadata.quilt_loader.metadata?.license != 'Apache-2.0') throw new GradleException('Unexpected QSL license declaration')
            if (!file('src/main/resources/META-INF/licenses/QSL-Apache-2.0.txt').isFile()) throw new GradleException('QSL license text must accompany the original payload')
        }
        project.ext.qslEntries.add([id: entry.id, group: entry.group, artifact: entry.artifact, version: entry.version, sha256: entry.sha256,
            file: payload, path: 'META-INF/jarjar/' + entry.artifact + '-' + entry.version + '.jar'])
    }
}
