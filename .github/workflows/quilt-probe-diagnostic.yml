name: Original API1 Quilt probe diagnostic

on:
  push:
    branches:
      - diagnostic/quilt-loom-api1-20261005-0934

permissions:
  contents: read

concurrency:
  group: quilt-loom-api1-diagnostic
  cancel-in-progress: false

jobs:
  build-original-probe:
    if: github.repository == 'Nexa-MC/unified-infinity' && github.ref == 'refs/heads/diagnostic/quilt-loom-api1-20261005-0934'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Read the approved diagnostic source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # official v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify source bytes and complete input pins
        run: python3 diagnostics/quilt-probe/ci/bootstrap.py check --require-ready
      - name: Generate pinned mappings and compile the unchanged probe
        run: python3 diagnostics/quilt-probe/ci/bootstrap.py build --fetch
      - name: Return only the exact small self-authored probe
        run: python3 diagnostics/quilt-probe/ci/bootstrap.py emit-probe
      - name: Record the diagnostic boundary
        if: always()
        run: |
          echo 'Build-only diagnostic: official unmodified Quilt Loom 1.8.5 and original API1 probe sources. No Minecraft launch, client assets, Fabric API, OPTab, or complex-mod test is performed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Minecraft inputs and generated Minecraft binaries stay on this ephemeral runner. No Actions cache or artifact uploads are configured.' >> "$GITHUB_STEP_SUMMARY"
